services:
  pipeline:
    #Build image dari Dockerfile lokal
    build: .
    container_name: taufiq_nyc_taxi_pipeline

    #Kirim environment variable DATA_URL ke dalam container
    environment:
      DATA_URL: "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2026-01.parquet"
      ZONE_LOOKUP_URL: "https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv"

    #Mount folder lokal ke container agar hasil tersimpan di host
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
